name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # The minimum supported Node, on one OS.
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Package the extension
        run: npx vsce package --no-dependencies -o md-review.vsix
      - name: Upload the package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v5
        with:
          name: md-review-vsix
          path: md-review.vsix

  # Opens MD Review in a real VS Code (test/smoke). It downloads VS Code, about
  # 150 MB, on every run, so it is advisory: a failed download or a flaky
  # window shows here without failing the workflow.
  smoke:
    name: VS Code smoke · ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run test:smoke
